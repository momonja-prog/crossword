<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>クロスワード実験</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           font-family: system-ui, sans-serif; background: #f4f5fb; color: #1b1f2a; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #0f1220; color: #eef0fa; } }
    p { line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:1.3rem;">クロスワード実験</h1>
    <p id="msg">実験のページへ移動しています…</p>
  </main>
  <script>
    // いまのサーバーのURLを毎回取り直す（GitHub Pages はページを最大10分ほど保存しておくため）
    fetch('target.json?t=' + Date.now(), { cache: 'no-store' })
      .then((res) => res.json())
      .then((data) => {
        if (!data.url) throw new Error('offline');
        location.replace(data.url.replace(/\/$/, '') + '/' + location.search);  // ?ac=（アクセスコード）を引き継ぐ
      })
      .catch(() => {
        document.getElementById('msg').innerHTML =
          '現在、実験は休止中です。<br>しばらくしてから、もう一度このページを開いてください。';
      });
  </script>
</body>
</html>
